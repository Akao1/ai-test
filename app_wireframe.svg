<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 28px; font-weight: bold; fill: #333; }
      .subtitle { font-family: sans-serif; font-size: 16px; fill: #666; }
      .text { font-family: sans-serif; font-size: 14px; fill: #333; }
      .small-text { font-family: sans-serif; font-size: 12px; fill: #555; }
      .box { fill: #f0f0f0; stroke: #999; stroke-width: 2; }
      .btn { fill: #e0e0e0; stroke: #888; stroke-width: 1.5; rx: 4; }
      .btn-blue { fill: #d0e8f2; stroke: #5b9bd5; stroke-width: 1.5; rx: 4; }
      .btn-green { fill: #d9ead3; stroke: #6aa84f; stroke-width: 1.5; rx: 4; }
      .btn-orange { fill: #fce5cd; stroke: #e69138; stroke-width: 1.5; rx: 4; }
      .ad-box { fill: #d9e2e3; stroke: #76a5af; stroke-width: 2; stroke-dasharray: 5,5; }
      .scroll-box { fill: #ead1dc; stroke: #c27ba0; stroke-width: 2; stroke-dasharray: 5,5; }
      .nav-item { fill: #fff9c4; stroke: #fbc02d; stroke-width: 1.5; rx: 4; }
      .nav-active { fill: #bbdefb; stroke: #1976d2; stroke-width: 2; rx: 20; }
      .tree-line { stroke: #999; stroke-width: 1.5; fill: none; }
      .phone-frame { fill: none; stroke: #333; stroke-width: 4; rx: 20; }
    </style>
  </defs>

  <!-- Phone Frame -->
  <rect x="50" y="50" width="400" height="700" class="phone-frame" />
  
  <!-- Header -->
  <rect x="60" y="60" width="380" height="40" fill="#2196f3" rx="4" />
  <text x="250" y="85" class="title" text-anchor="middle" fill="white">浔智-本地工厂智能服务平台</text>
  <text x="70" y="115" class="subtitle">定位：南浔</text>
  
  <!-- Search Box -->
  <rect x="80" y="130" width="280" height="36" class="box" rx="18" />
  <text x="220" y="153" class="text" text-anchor="middle" fill="#999">搜索框</text>
  <rect x="370" y="130" width="50" height="36" class="btn-blue" rx="4" />
  <text x="395" y="153" class="text" text-anchor="middle">搜索</text>
  
  <!-- 3x3 Grid -->
  <!-- Row 1 -->
  <rect x="80" y="180" width="110" height="40" class="btn-blue" />
  <text x="135" y="205" class="text" text-anchor="middle">厂房租售</text>
  <rect x="200" y="180" width="110" height="40" class="btn-blue" />
  <text x="255" y="205" class="text" text-anchor="middle">紧急维修</text>
  <rect x="320" y="180" width="110" height="40" class="btn-blue" />
  <text x="375" y="205" class="text" text-anchor="middle">外协订单</text>
  
  <!-- Row 2 -->
  <rect x="80" y="230" width="110" height="40" class="btn-green" />
  <text x="135" y="255" class="text" text-anchor="middle">货源直购</text>
  <rect x="200" y="230" width="110" height="40" class="btn-green" />
  <text x="255" y="255" class="text" text-anchor="middle">招贤纳士</text>
  <rect x="320" y="230" width="110" height="40" class="btn-green" />
  <text x="375" y="255" class="text" text-anchor="middle">二手机械</text>
  
  <!-- Row 3 -->
  <rect x="80" y="280" width="110" height="40" class="btn-orange" />
  <text x="135" y="305" class="text" text-anchor="middle">商务接待</text>
  <rect x="200" y="280" width="110" height="40" class="btn-orange" />
  <text x="255" y="305" class="text" text-anchor="middle">直连大厂</text>
  <rect x="320" y="280" width="110" height="40" class="btn-orange" />
  <text x="375" y="305" class="text" text-anchor="middle">金融助力</text>
  
  <!-- Ad Box -->
  <rect x="80" y="340" width="340" height="80" class="ad-box" rx="8" />
  <text x="250" y="385" class="title" text-anchor="middle">广告展览位</text>
  
  <!-- Scroll Box -->
  <rect x="80" y="430" width="340" height="60" class="scroll-box" rx="8" />
  <text x="250" y="465" class="title" text-anchor="middle">信息滚动位</text>
  <polygon points="380,440 390,460 380,480" fill="#c27ba0" />
  
  <!-- Bottom Nav -->
  <rect x="80" y="510" width="60" height="30" class="nav-item" />
  <text x="110" y="530" class="small-text" text-anchor="middle">需求发布</text>
  <rect x="150" y="510" width="50" height="30" class="nav-item" />
  <text x="175" y="530" class="small-text" text-anchor="middle">订单</text>
  <rect x="210" y="510" width="60" height="30" class="nav-active" />
  <text x="240" y="530" class="small-text" text-anchor="middle">AI交互</text>
  <rect x="280" y="510" width="50" height="30" class="nav-item" />
  <text x="305" y="530" class="small-text" text-anchor="middle">消息</text>
  <rect x="340" y="510" width="50" height="30" class="nav-item" />
  <text x="365" y="530" class="small-text" text-anchor="middle">我的</text>

  <!-- Tree Diagrams Below -->
  <!-- 需求发布 -->
  <text x="150" y="620" class="subtitle" text-anchor="middle">需求发布</text>
  <line x1="150" y1="630" x2="150" y2="660" class="tree-line" />
  <line x1="80" y1="660" x2="220" y2="660" class="tree-line" />
  <line x1="80" y1="660" x2="80" y2="690" class="tree-line" />
  <line x1="150" y1="660" x2="150" y2="690" class="tree-line" />
  <line x1="220" y1="660" x2="220" y2="690" class="tree-line" />
  <text x="80" y="710" class="text" text-anchor="middle">抢修</text>
  <text x="150" y="710" class="text" text-anchor="middle">找货</text>
  <text x="220" y="710" class="text" text-anchor="middle">找人</text>
  <text x="150" y="750" class="small-text" text-anchor="middle">能发图片、</text>
  <text x="150" y="770" class="small-text" text-anchor="middle">视频和文字</text>

  <!-- 消息 -->
  <text x="400" y="620" class="subtitle" text-anchor="middle">消息</text>
  <line x1="400" y1="630" x2="400" y2="660" class="tree-line" />
  <line x1="330" y1="660" x2="470" y2="660" class="tree-line" />
  <line x1="330" y1="660" x2="330" y2="690" class="tree-line" />
  <line x1="470" y1="660" x2="470" y2="690" class="tree-line" />
  <text x="330" y="710" class="text" text-anchor="middle">AI计算后</text>
  <text x="330" y="730" class="small-text" text-anchor="middle">匹配推送消息</text>
  <text x="330" y="750" class="small-text" text-anchor="middle">及用户之间</text>
  <text x="330" y="770" class="small-text" text-anchor="middle">的聊天界面</text>
  <text x="470" y="710" class="text" text-anchor="middle">系统推送消息</text>

  <!-- 我的 -->
  <text x="650" y="620" class="subtitle" text-anchor="middle">我的</text>
  <line x1="650" y1="630" x2="650" y2="660" class="tree-line" />
  <line x1="530" y1="660" x2="770" y2="660" class="tree-line" />
  <line x1="530" y1="660" x2="530" y2="690" class="tree-line" />
  <line x1="590" y1="660" x2="590" y2="690" class="tree-line" />
  <line x1="650" y1="660" x2="650" y2="690" class="tree-line" />
  <line x1="710" y1="660" x2="710" y2="690" class="tree-line" />
  <line x1="770" y1="660" x2="770" y2="690" class="tree-line" />
  <text x="530" y="710" class="text" text-anchor="middle">我要入驻</text>
  <text x="590" y="710" class="text" text-anchor="middle">设置</text>
  <text x="650" y="710" class="text" text-anchor="middle">店铺和</text>
  <text x="650" y="730" class="text" text-anchor="middle">企业资料</text>
  <text x="710" y="710" class="text" text-anchor="middle">意见反馈</text>
  <text x="770" y="710" class="text" text-anchor="middle">订单</text>
  
  <!-- 我要入驻 子节点 -->
  <line x1="530" y1="740" x2="530" y2="770" class="tree-line" />
  <line x1="490" y1="770" x2="570" y2="770" class="tree-line" />
  <line x1="490" y1="770" x2="490" y2="800" class="tree-line" />
  <line x1="530" y1="770" x2="530" y2="800" class="tree-line" />
  <line x1="570" y1="770" x2="570" y2="800" class="tree-line" />
  <text x="490" y="820" class="text" text-anchor="middle">工厂</text>
  <text x="530" y="820" class="text" text-anchor="middle">工程师</text>
  <text x="530" y="840" class="small-text" text-anchor="middle">(技术工种)</text>
  <text x="570" y="820" class="text" text-anchor="middle">服务商</text>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">APP框架首页设想 (低保真线框图)</text>
</svg>
