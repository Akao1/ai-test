server:
  port: 3000

spring:
  datasource:
    url: jdbc:h2:file:./data/mall;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: mall-backend-secret-key-2026-ai-test
    expiration: 86400000
